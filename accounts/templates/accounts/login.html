{% extends "base.html" %}

{% block title %}Login | JobMatch Campus Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="panel">
            <div class="panel-header px-3 py-2">Login to the Portal</div>
            <div class="card-body">
                <p class="muted-note mb-3">Use your demo account to see the matching flow.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login Now</button>
                </form>

                <div class="mt-3 p-3" style="background:#f7f3e6; border:1px dashed #b89c54;">
                    <strong>Demo hint:</strong> alice@demo.com / pass1234
                </div>

                <p class="mt-3 mb-0 text-center">
                    <a href="{% url 'register' %}">Need an account?</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
